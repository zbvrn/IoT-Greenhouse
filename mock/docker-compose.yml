# Configurable ThingsBoard device emulator.
services:
  greenhouse-emulator:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app/mock
    environment:
      - MOCK_CONFIG_FILE=/app/mock/config.json
    command: >
      python3 /app/mock/send_telemetry.py
    restart: unless-stopped
